name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 型チェック
        run: pnpm typecheck
      - name: 画面の型チェック
        run: npx tsc --noEmit -p apps/web/tsconfig.json
      - name: 画面のビルド
        run: pnpm build
      - name: 記号カタログの生成（記号定義の整合性チェックを兼ねる）
        run: pnpm catalog
      - name: ナレッジベース（質問定義・構成ルール）の検証
        run: pnpm check
      - name: 検証用の作図テストを生成
        run: pnpm sample
      - name: 生成物が最新か確認
        run: git diff --exit-code docs/symbol-catalog.html docs/sample-drawing.svg

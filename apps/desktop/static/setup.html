<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>接続先の設定</title>
    <style>
      body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "IPAGothic", sans-serif;
        margin: 0; padding: 22px; background: #eef1ef; color: #161a18; font-size: 13px; }
      h1 { font-size: 15px; margin: 0 0 6px; }
      p { margin: 0 0 14px; color: #69736f; font-size: 12px; line-height: 1.7; }
      input { width: 100%; padding: 9px 10px; border: 1px solid #d3d9d5; border-radius: 2px; font: inherit; }
      button { margin-top: 16px; padding: 9px 18px; background: #f4ead0; border: 1px solid #9a7412;
        border-radius: 2px; cursor: pointer; font: inherit; }
    </style>
  </head>
  <body>
    <h1>接続先のサーバー</h1>
    <p>社内のサーバーの住所を入力してください。<br />例: http://192.168.1.10:8787</p>
    <input id="url" placeholder="http://192.168.1.10:8787" autofocus />
    <button id="ok" type="button">この接続先で使う</button>
    <script>
      const input = document.getElementById('url');
      const send = () => window.zumenSetup.submit(input.value);
      document.getElementById('ok').addEventListener('click', send);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
    </script>
  </body>
</html>
